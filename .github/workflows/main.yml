name: Build Liquid Glass Windows Icons

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate Liquid Glass .ICO pack
        run: python generate_glass_icons.py

      - name: Upload Windows Icon Pack (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Liquid-Glass-Windows-ICO
          path: LiquidGlass_Windows_ICO/*.ico
